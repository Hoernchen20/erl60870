name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28']

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3'

      - name: Cache build artefacts
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-

      - run: rebar3 compile
      - run: rebar3 xref
      - run: rebar3 eunit
      - run: rebar3 ct
      - run: rebar3 dialyzer

  docs:
    name: ex_doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3'

      # ex_doc's Markdown parser is incompatible with the OTP 28.0.x `re`
      # module, so docs are built on OTP 27.
      - run: rebar3 ex_doc
